<!--
  Maquette de référence validée (2026-11-14) : écran ouvert en cliquant l'encart de profil (en haut à droite).
  Sections : Profil, Missions quotidiennes (minuteur de renouvellement), Succès (en lignes comme les missions, récompense en jetons, bouton Réclamer),
  Classement (Elo : victoire = points gagnés, défaite = points perdus ; podium pour le top 3, puis liste ; onglets Amis / Général),
  Social (ajout par pseudo, demandes, amis avec présence et Rejoindre / Regarder), Historique (variation d'Elo et jetons par partie).
  À fixer : Elo de départ (1 000 ici), coefficient K, règle pour les parties à plus de deux joueurs, saisons, liste réelle des missions et succès.
  Autonome : ouvrir dans un navigateur (polices Google Fonts chargées en ligne).

#to{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;background:#2a2750;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;display:none;z-index:20;white-space:nowrap}
</style>

b='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3 style="margin:0">Classement</h3><div class="sg2"><button data-sc="f" class="'+(sc==='f'?'on':'')+'">Amis</button><button data-sc="g" class="'+(sc==='g'?'on':'')+'">Général</button></div></div><div style="font-size:12px;color:#7a77a0;margin-bottom:4px">Classement Elo : une victoire fait gagner des points, une défaite en fait perdre. Battre un adversaire mieux classé rapporte plus.</div>'+pod(L)+L.slice(3).map(function(p,i){return '<div class="rw'+(p[4]?' me':'')+'"><div class="rk">'+(i+4)+'</div><div class="av" style="background:'+p[1]+'"></div><div style="flex:1"><div style="font-weight:600">'+p[0]+(p[4]?' <span style="font-size:11.5px;color:#6f5be0;font-weight:600">(toi)</span>':'')+'</div></div><div>'+dl(p[3])+'</div><div style="font-weight:600;font-size:15px;min-width:62px;text-align:right">'+p[2]+'</div></div>'}).join('')+(sc==='g'?'<div style="text-align:center;color:#9a97bd;margin:-2px 0 6px;letter-spacing:3px">···</div><div class="rw me"><div class="rk">128</div><div class="av" style="background:#ffd6e1"></div><div style="flex:1"><div style="font-weight:600">Léa <span style="font-size:11.5px;color:#6f5be0;font-weight:600">(toi)</span></div></div><div>'+dl(14)+'</div><div style="font-weight:600;font-size:15px;min-width:62px;text-align:right">1084</div></div>':'')+'<div style="font-size:12px;color:#7a77a0">Les points Elo se remettent à 1 000 au début de chaque saison.</div>'}
if(sec==='soc'){b='<h3>Social</h3><div style="display:flex;gap:8px;margin-bottom:10px"><input class="in" placeholder="Ajouter un ami par pseudo"><button class="pb" id="ad">Envoyer</button></div>'+(RQ.length?'<h4>Demandes reçues</h4>'+RQ.map(function(r,i){return '<div class="rw"><div style="flex:1;font-weight:600">'+r+'<small>veut devenir ton ami</small></div><button class="pb" data-a="'+i+'">Accepter</button><button class="pb d" data-r="'+i+'">Refuser</button></div>'}).join(''):'')+'<h4>Amis</h4>'+FR.map(function(f){return '<div class="rw"><div class="av" style="background:'+f[1]+'"></div><div style="flex:1"><div style="font-weight:600">'+f[0]+'</div><small><span class="dot" style="background:'+(f[3]?'#2fa56f':'#b5b2c9')+'"></span>'+f[2]+'</small></div>'+(f[4]?'<button class="pb g" data-j="'+f[0]+'">'+f[4]+'</button>':'')+'</div>'}).join('')}
if(sec==='hist')b='<h3>Historique</h3>'+HI.map(function(h){return '<div class="rw"><div style="flex:1"><div style="font-weight:600">'+h[0]+'</div><small>'+h[4]+'</small></div><div style="font-weight:600;color:'+(h[1]==='Victoire'?'#1f8a58':'#c4243b')+'">'+h[1]+'</div><div style="min-width:54px;text-align:right">'+dl(h[3])+'<small style="font-size:11px">Elo</small></div><div style="display:flex;align-items:center;gap:4px;color:#e0a100;font-weight:600">'+ic('tokens','15px')+'<span style="color:#000">'+h[2]+'</span></div></div>'}).join('');
ov.innerHTML='<div style="display:flex;height:100%"><div style="width:170px;padding:12px 8px;border-right:1px solid #eceaf6">'+N.map(function(n){return '<button class="sn'+(sec===n[0]?' on':'')+'" data-n="'+n[0]+'"><span>'+n[1]+'</span>'+(n[2]?'<span class="bd">'+n[2]+'</span>':'')+'</button>'}).join('')+'</div><div class="sb" style="flex:1;padding:16px 20px;overflow-y:auto;height:100%;box-sizing:border-box">'+b+'</div></div>';
ov.querySelectorAll('[data-n]').forEach(function(x){x.onclick=function(){sec=x.dataset.n;draw()}});
ov.querySelectorAll('[data-m]').forEach(function(x){x.onclick=function(){var i=+x.dataset.m;got[i]=1;coins+=M[i][3];draw();toast('+'+M[i][3]+' jetons reçus.')}});
ov.querySelectorAll('[data-s]').forEach(function(x){x.onclick=function(){var i=+x.dataset.s;gotA[i]=1;coins+=AC[i][5];draw();toast('+'+AC[i][5]+' jetons reçus.')}});
ov.querySelectorAll('[data-sc]').forEach(function(x){x.onclick=function(){sc=x.dataset.sc;draw()}});
ov.querySelectorAll('[data-a]').forEach(function(x){x.onclick=function(){var n=RQ.splice(+x.dataset.a,1)[0];FR.unshift([n,'#e1d8fb','en ligne',1,'Rejoindre']);draw();toast(n+' est maintenant ton ami.')}});
ov.querySelectorAll('[data-r]').forEach(function(x){x.onclick=function(){RQ.splice(+x.dataset.r,1);draw()}});
ov.querySelectorAll('[data-j]').forEach(function(x){x.onclick=function(){toast('Direction la chambre de '+x.dataset.j+'.')}});
if($('ad'))$('ad').onclick=function(){toast('Demande envoyée.')};
if($('ed'))$('ed').onclick=function(){toast('Ouverture de l’éditeur d’avatar au miroir.')};
tick()}
function tick(){var t=$('tm');if(t)t.textContent='Nouvelles missions dans '+fmt(end-Date.now())}
setInterval(tick,1000);
$('pf').onclick=function(){open=!open;draw()};
draw()})();
</script>
</body>
</html>
