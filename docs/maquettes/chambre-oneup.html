<title>Maquette de la chambre OneUP</title>
<!--
  Maquette de référence validée (2026-11-13) : chambre isométrique en diagonale, HUD blanc plat arrondi,

<style>
body{margin:0;background:#eeedf7;font-family:'Outfit',system-ui,sans-serif;padding:24px}

.hb{font-family:'Jersey 15',sans-serif;font-size:20px;background:#ffe08a;color:#3a2a00;border:3px solid #0f0d22;border-bottom-width:6px;border-radius:12px;padding:0 14px;cursor:pointer;display:block;width:100%;margin:4px 0}
.w{background:#fff;color:#2a2750;font-family:'Outfit',sans-serif;border-radius:18px}

.sw{height:48px;border-radius:10px;margin-bottom:8px}

.bar button{font:inherit;font-size:13px;padding:6px 12px;border-radius:10px;border:1px solid #c9c5e6;background:#fff;cursor:pointer}
