  Maquette de référence validée (2026-11-14) : écran ouvert depuis la console de la chambre.

  avec le texte français écrit directement dessus (72 px), règles, réglage du temps de décision (hôte seulement), compte à rebours de lancement.
  Invité : « Proposer ce jeu à l'hôte ». « Rejoindre un groupe » : code de chambre en 4 cases d'un caractère en portrait, liste de chambres ouvertes.

$('pf').innerHTML='<span style="width:46px;height:46px;border-radius:50%;background:'+(host?'#ffd6e1':'#ffeeb0')+';overflow:hidden;position:relative;flex:none;display:block"><span style="position:absolute;left:12px;top:8px;width:21px;height:21px;border-radius:50%;background:#ffe0c2;display:block"></span><span style="position:absolute;left:4px;top:32px;width:37px;height:30px;border-radius:50%;background:#7ec8f5;display:block"></span></span><span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.2">'+(host?'Léa':'Max')+' <span style="font-size:12px;font-weight:500;color:#6f5be0;background:#eceaff;border-radius:8px;padding:1px 7px;margin-left:4px">Niv. '+(host?7:3)+'</span></span><span style="display:flex;align-items:center;gap:5px;margin-top:3px;color:#e0a100">'+ic('tokens')+'<span style="font-size:14px;font-weight:500;color:#2a2750">'+(host?'1 250':'480')+'</span></span></span>'}
function draw(){head();var ov=$('ov');if(!open){ov.style.display='none';return}ov.style.display='block';var b='',g=G[gi];
if(mode==='lancer'){
var enough=PL.length>=g.min&&PL.length<=g.max;
b='<div style="display:flex;gap:16px;height:100%"><div style="width:236px;flex:none"><div class="lb" style="margin-top:0">Choisis une cartouche</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">'+G.map(function(x,i){return '<button class="ct'+(i===gi?' on':'')+'" data-g="'+i+'">'+(x.ok?'':'<span class="bt">Bientôt</span>')+'<div class="cg" style="--c:'+x.c+(x.ok?'':';filter:grayscale(.6) opacity(.8)')+'"><b>'+x.k+'</b></div>'+x.t+'</button>'}).join('')+'</div></div>'+
'<div style="flex:1;min-width:0;overflow-y:auto;padding-right:4px"><h3>'+g.t+'</h3><div style="font-size:13px;color:#6d6a8f">'+g.s+'</div><div style="display:flex;gap:6px;margin:8px 0 6px">'+g.b.map(function(x){return bi(x[0],x[1])}).join('')+'</div><div style="display:flex;align-items:center;gap:10px;margin:0 0 4px"><div style="display:flex">'+PL.map(function(p){return '<div class="av" style="background:'+p[0]+'"></div>'}).join('')+'</div><div style="font-size:13px;color:#000;font-weight:600">'+PL.length+' dans la chambre</div></div>'+
(g.ok?'<div class="rl"><b>Règles.</b> '+g.rules+'</div><div class="lb">Réglages de la partie'+(host?'':' (choisis par l’hôte)')+'</div><div style="display:flex;justify-content:space-between;align-items:center;background:#f4f3fb;border-radius:12px;padding:8px 12px;font-size:14px;color:#000">Temps de décision<div class="sg3">'+[10,20,30,60].map(function(s){return '<button data-d="'+s+'" class="'+(dec===s?'on':'')+'"'+(host?'':' style="cursor:default"')+'>'+s+' s</button>'}).join('')+'</div></div>':'<div class="rl">Ce jeu arrive bientôt. Tu pourras le lancer dès sa sortie.</div>')+
'<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+(g.ok?(host?'<button class="pb" id="go">Lancer la partie</button>':(prop===gi?'<button class="pb o">Proposition envoyée</button>':'<button class="pb" id="pp">Proposer ce jeu à l’hôte</button>')):'<button class="pb g" id="nt">Me prévenir à la sortie</button>')+(g.ok&&!enough?'<span style="font-size:12.5px;color:#c4243b">Il faut au moins '+g.min+' joueur'+(g.min>1?'s':'')+'.</span>':'')+'</div></div></div>'}
else b='<div style="max-width:440px"><h3>Rejoindre un groupe</h3><div style="font-size:13px;color:#6d6a8f;margin-bottom:12px">Entre le code de 4 caractères d’une chambre.</div><div style="display:flex;gap:10px;align-items:center" id="cxs">'+[0,1,2,3].map(function(i){return '<input class="cx" maxlength="1" data-i="'+i+'" autocomplete="off" inputmode="text" aria-label="Caractère '+(i+1)+' du code">'}).join('')+'<button class="pb" id="jn" style="margin-left:8px">Rejoindre</button></div><div id="cm" style="font-size:12.5px;margin:8px 0 4px;min-height:16px;color:#c4243b">'+codeMsg+'</div><div class="lb">Chambres ouvertes</div>'+RO.map(function(r){return '<div class="rw"><div style="flex:1"><div style="font-weight:600">Chambre de '+r[0]+'</div><small>'+r[1]+' · '+r[2]+' joueurs</small></div><button class="pb g" data-r="'+r[0]+'" style="padding:7px 14px">Rejoindre</button></div>'}).join('')+'</div>';
ov.innerHTML='<div style="display:flex;flex-direction:column;height:100%"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #eceaf6"><div style="display:flex;align-items:center;gap:14px"><div style="font-size:18px;font-weight:600;line-height:1;color:#000">Console</div><div class="sg2"><button data-m="lancer" class="'+(mode==='lancer'?'on':'')+'">Lancer une partie</button><button data-m="rejoindre" class="'+(mode==='rejoindre'?'on':'')+'">Rejoindre un groupe</button></div></div><button class="pb g" id="cl" style="padding:7px 14px">Fermer</button></div><div style="flex:1;overflow:hidden;padding:14px 18px;min-height:0">'+b+'</div></div>';
ov.querySelectorAll('[data-m]').forEach(function(x){x.onclick=function(){mode=x.dataset.m;codeMsg='';draw()}});
ov.querySelectorAll('[data-g]').forEach(function(x){x.onclick=function(){gi=+x.dataset.g;draw()}});
ov.querySelectorAll('[data-d]').forEach(function(x){x.onclick=function(){if(!host){toast('Seul l’hôte règle la partie.');return}dec=+x.dataset.d;draw()}});
ov.querySelectorAll('[data-r]').forEach(function(x){x.onclick=function(){toast('Direction la chambre de '+x.dataset.r+'.');open=false;draw()}});
if($('cl'))$('cl').onclick=function(){open=false;draw()};
if($('pp'))$('pp').onclick=function(){prop=gi;draw();toast('Proposition envoyée : l’hôte peut la valider.')};
if($('nt'))$('nt').onclick=function(){toast('On te prévient à la sortie de '+G[gi].t+'.')};
if($('go'))$('go').onclick=function(){if(PL.length<G[gi].min){toast('Pas assez de joueurs.');return}launch()};
if($('cxs'))codeBoxes()}
function codeBoxes(){var bx=[].slice.call(document.querySelectorAll('.cx')),cm=$('cm');
function val(){return bx.map(function(x){return x.value}).join('').toUpperCase()}
function clr(){cm.textContent='';bx.forEach(function(x){x.classList.remove('bad')})}
bx[0].focus();
bx.forEach(function(x,i){
x.addEventListener('input',function(){x.value=x.value.replace(/[^A-Za-z0-9]/g,'').slice(-1).toUpperCase();clr();if(x.value&&i<3)bx[i+1].focus();if(val().length===4)$('jn').focus()});
x.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!x.value&&i>0){bx[i-1].value='';bx[i-1].focus();e.preventDefault()}else if(e.key==='ArrowLeft'&&i>0){bx[i-1].focus()}else if(e.key==='ArrowRight'&&i<3){bx[i+1].focus()}else if(e.key==='Enter'){$('jn').click()}});
x.addEventListener('paste',function(e){var t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,4);if(!t)return;e.preventDefault();bx.forEach(function(y,j){y.value=t[j]||''});clr();bx[Math.min(t.length,3)].focus()});
x.addEventListener('focus',function(){x.select()})});
$('jn').onclick=function(){var v=val();if(v.length<4){cm.textContent='Entre les 4 caractères du code.';bx.forEach(function(x){if(!x.value)x.classList.add('bad')});return}
if(v==='KX7P'||v==='ZD4Q'||v==='KR9T'){toast('Direction la chambre '+v+'.');open=false;draw()}else{cm.textContent='Code inconnu. Vérifie-le auprès de l’hôte.';bx.forEach(function(x){x.classList.add('bad')})}}}
function launch(){var c=$('cd'),n=3;$('cdt').textContent='La cartouche '+G[gi].t+' est insérée…';$('cdn').textContent=n;c.style.display='flex';var h=setInterval(function(){n--;if(n<=0){clearInterval(h);c.style.display='none';toast('Partie lancée (simulation).');open=false;draw()}else $('cdn').textContent=n},900)}
$('v1').onclick=function(){host=true;prop=null;draw()};$('v2').onclick=function(){host=false;prop=null;draw()};
window.addEventListener('keydown',function(e){if(e.key==='Escape'&&open){open=false;draw()}});
draw();var re=document.createElement('button');re.textContent='Rouvrir la console';re.style.cssText='position:absolute;left:50%;transform:translateX(-50%);top:240px;z-index:5;border:0;background:#6f5be0;color:#fff;font-weight:600;font-size:13px;padding:10px 18px;border-radius:12px;cursor:pointer';re.onclick=function(){open=true;mode='lancer';draw()};$('sg').appendChild(re)})();
</script>
</body>
</html>
